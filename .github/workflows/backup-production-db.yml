name: Backup production database

# S03-09 — Supabase's free plan (what both AdorWorks projects are on)
# includes no automatic backups at all; that's a Pro-plan feature
# ($25/month+). The founder chose to build a free scheduled backup
# instead of upgrading — see docs/governance/backups-and-restore.md for
# the full decision and restore instructions.
#
# Needs a repository secret named PROD_SUPABASE_DB_URL — the production
# project's direct Postgres connection string (Supabase dashboard ->
# Project Settings -> Database -> Connection string). Add it directly
# via GitHub's own Settings -> Secrets and variables -> Actions UI;
# never paste this value into a chat with Claude Code or commit it
# anywhere — it's a full-access production database credential.

on:
  schedule:
    - cron: "0 2 * * *" # 02:00 UTC daily
  workflow_dispatch: {} # lets you trigger a backup on demand from the Actions tab

jobs:
  backup:
    runs-on: ubuntu-latest
    # Runs inside the official postgres:17 image so pg_dump/pg_restore
    # match Supabase's actual server version (confirmed live: 17.6).
    # Ubuntu's own postgresql-client package installs v16, and pg_dump
    # refuses outright to dump from a server newer than itself — hit
    # this for real on the first live run. Bump this tag if Supabase
    # ever upgrades to a new Postgres major version (a newer pg_dump can
    # still read an older server, so this only needs to track "at least
    # as new as the server," not an exact match).
    container:
      image: postgres:17
    steps:
      - name: Check the secret is configured
        env:
          SUPABASE_DB_URL: ${{ secrets.PROD_SUPABASE_DB_URL }}
        run: |
          # Passed via env, not interpolated directly into this script,
          # since a real connection string could contain characters
          # (quotes, $, backticks) that would otherwise be parsed as
          # shell syntax rather than literal text.
          if [ -z "$SUPABASE_DB_URL" ]; then
            echo "::error::PROD_SUPABASE_DB_URL secret is not set — add it under Settings -> Secrets and variables -> Actions before this workflow can back anything up."
            exit 1
          fi

      - name: Dump production database
        env:
          SUPABASE_DB_URL: ${{ secrets.PROD_SUPABASE_DB_URL }}
        run: |
          set -euo pipefail
          FILENAME="adorworks-production-$(date -u +%Y%m%dT%H%M%SZ).dump"
          echo "FILENAME=$FILENAME" >> "$GITHUB_ENV"
          # --schema=public --data-only: AdorWorks's schema is already
          # fully reproducible from backend/supabase/migrations/ (the
          # same files applied to every environment via
          # backend/api/scripts/apply-migrations.js) — this backup only
          # needs to cover DATA, never schema. That's not just simpler;
          # it's the fix for two real conflicts hit restoring a
          # schema-carrying dump into a different Supabase project: (1)
          # a full pg_dump also captures Supabase's own platform-managed
          # schemas (auth, storage, realtime, extensions, vault, etc.),
          # which already exist — differently — in any other Supabase
          # project (575 restore errors, first rehearsal attempt); (2)
          # even scoped to just public, pg_dump still captures database-
          # wide objects like event triggers, one of which
          # (extensions.pgrst_drop_watch, PostgREST's own schema-cache
          # invalidation trigger) is owned by a superuser in production
          # but the restoring role isn't a superuser in any project —
          # Postgres refuses to recreate it regardless of which project
          # you restore into (687 restore errors, second attempt). A
          # data-only dump contains no DDL/triggers/extensions at all,
          # sidestepping both permanently. public holds every one of
          # AdorWorks's own application tables — see
          # docs/governance/schema-and-ownership-map.md.
          #
          # Known, accepted limitation: this does NOT capture auth.users
          # (Supabase Auth's own account records — emails, password
          # hashes) — a separate, riskier restore concern tied to each
          # project's own Auth service internals, and free-tier Supabase
          # has no backup of that layer regardless. A real disaster
          # recovery would still recover every application record
          # (profiles, contracts, payments, etc.), just not existing
          # accounts' ability to log back in with unchanged credentials.
          # Worth revisiting deliberately later, not silently accepted.
          pg_dump "$SUPABASE_DB_URL" --format=custom --no-owner --no-acl \
            --schema=public --data-only --file="$FILENAME"

      - name: Verify the dump is a valid, readable archive
        run: |
          set -euo pipefail
          pg_restore --list "$FILENAME" > /dev/null
          echo "Dump verified as a valid pg_dump archive: $FILENAME"
          ls -lh "$FILENAME"

      # 30 days of retention here (vs. Supabase Pro's 7) since a small
      # pilot database's dumps are tiny relative to the free plan's
      # 500MB artifact-storage quota — cheap to keep more history.
      - name: Upload backup as a workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.FILENAME }}
          path: ${{ env.FILENAME }}
          retention-days: 30
