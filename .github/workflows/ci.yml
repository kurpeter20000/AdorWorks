name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  platform:
    name: platform (lint, unit tests, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: platform
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: platform/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run test
      - run: npm run build
        env:
          # Build-time placeholders only — no live Supabase project is
          # contacted during `next build` (dynamic routes aren't
          # pre-rendered, and no server-only module reads these at
          # import time). Real values come from the deploy platform's
          # own environment config at runtime.
          NEXT_PUBLIC_SUPABASE_URL: https://ci-placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-anon-key
          SUPABASE_SECRET_KEY: ci-placeholder-secret-key

  backend-api:
    name: backend/api (unit tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/api/package-lock.json
      - run: npm ci
      - run: npm run test
