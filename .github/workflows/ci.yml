name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  platform:
    name: platform (lint, unit tests, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: platform
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: platform/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run test
      - run: npm run build
        env:
          # Build-time placeholders only — no live Supabase project is
          # contacted during `next build` (dynamic routes aren't
          # pre-rendered, and no server-only module reads these at
          # import time). Real values come from the deploy platform's
          # own environment config at runtime.
          NEXT_PUBLIC_SUPABASE_URL: https://ci-placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-anon-key
          SUPABASE_SECRET_KEY: ci-placeholder-secret-key

  lighthouse:
    name: platform (Lighthouse performance budget)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: platform
    # S12-12/S12-13 — a real, enforced performance budget rather than a
    # one-off manual audit. Scoped to the three pages Lighthouse can test
    # without a login flow (/ , /login, /signup — every other priority
    # page requires auth, which is a real gap: authenticated-page budget
    # enforcement needs a Puppeteer login script Lighthouse CI supports
    # but isn't built here yet). No `preset` set in .lighthouserc.json,
    # so this runs Lighthouse's default mobile emulation + simulated
    # throttling — deliberately, since the pilot is mobile-first on
    # South Sudan connections, not a fast desktop/office network.
    # Thresholds are the industry-standard "good" Core Web Vitals
    # targets (LCP<2.5s, CLS<0.1), not a founder-approved number — flag
    # for a quick founder confirmation if a different budget was
    # intended. Read-only against a locally built instance (no shared
    # database touched), so — unlike e2e.yml — this runs automatically
    # on every push/PR with no staging-collision risk.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: platform/package-lock.json
      - run: npm ci
      - run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://ci-placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-anon-key
          SUPABASE_SECRET_KEY: ci-placeholder-secret-key
      - name: Start the app and wait for it to respond
        run: |
          NEXT_PUBLIC_SUPABASE_URL=https://ci-placeholder.supabase.co \
          NEXT_PUBLIC_SUPABASE_ANON_KEY=ci-placeholder-anon-key \
          SUPABASE_SECRET_KEY=ci-placeholder-secret-key \
          npm run start &
          for i in $(seq 1 30); do
            if curl -sf http://localhost:3000/login > /dev/null; then
              echo "App is up."
              exit 0
            fi
            sleep 2
          done
          echo "App did not become ready in time." >&2
          exit 1
      - run: npx lhci autorun
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lighthouse-report
          path: platform/.lighthouseci
          retention-days: 14

  backend-api:
    name: backend/api (lint, unit tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/api/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run test
