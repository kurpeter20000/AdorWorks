name: Restore rehearsal (test project only)

# S03-10 — proves the S03-09 backup can actually be restored, not just
# that it exists. Takes a FRESH dump of production (same command the
# backup workflow uses) and restores it straight into the TEST project,
# all in one run — closer to a real disaster-recovery drill than
# reusing an old artifact, and needs no run-id lookups from whoever
# triggers it.
#
# Data-only, same as the backup workflow (see its comment for why):
# AdorWorks's schema is already fully reproducible from
# backend/supabase/migrations/, applied identically to both projects —
# a real restore only ever needs to bring the DATA back, never recreate
# schema/triggers/extensions. Three earlier attempts each failed for a
# real, live reason: dumping Supabase's own platform-managed schemas
# (auth, storage, extensions, etc.) collides with the different copies
# already in the test project (575 errors); even scoped to public
# alone, pg_dump still captures database-wide event triggers Supabase
# owns as a superuser that a non-superuser restoring role can never
# recreate in any project (687 errors, "extensions.pgrst_drop_watch");
# and pg_restore's --disable-triggers itself needs superuser to disable
# Postgres's internal FK-check triggers, which Supabase's connection
# role deliberately isn't (115 errors, "RI_ConstraintTrigger_... is a
# system trigger"). Fixed by dropping foreign key constraints (normal
# owner-level DDL, not privileged) before the data load and recreating
# them after — see the workflow steps below.
#
# IMPORTANT: running this OVERWRITES the test project's public-schema
# data (its own application tables — talent profiles, organisations,
# contracts, etc.) with a copy of production's real data for those same
# tables (every public table is truncated first, see below). That's
# intentional — it's what actually proves a restore works — but
# re-seed the test project afterward (cd backend/api &&
# SUPABASE_URL=... SUPABASE_SERVICE_ROLE_KEY=...
# SEED_CONFIRM=yes-seed-this-database npm run seed) so it doesn't sit
# holding a copy of production's application data indefinitely.
#
# Needs a second repository secret beyond the backup workflow's:
# TEST_SUPABASE_DB_URL — the TEST project's Session pooler connection
# string (Supabase dashboard -> the TEST project, not production ->
# Connect -> Session pooler). Same reasoning as PROD_SUPABASE_DB_URL:
# add it directly via GitHub's Settings -> Secrets and variables ->
# Actions UI, never through chat.

on:
  workflow_dispatch: {}

jobs:
  restore-rehearsal:
    runs-on: ubuntu-latest
    container:
      image: postgres:17
    steps:
      - name: Check both secrets are configured
        env:
          PROD_SUPABASE_DB_URL: ${{ secrets.PROD_SUPABASE_DB_URL }}
          TEST_SUPABASE_DB_URL: ${{ secrets.TEST_SUPABASE_DB_URL }}
        run: |
          missing=""
          [ -z "$PROD_SUPABASE_DB_URL" ] && missing="$missing PROD_SUPABASE_DB_URL"
          [ -z "$TEST_SUPABASE_DB_URL" ] && missing="$missing TEST_SUPABASE_DB_URL"
          if [ -n "$missing" ]; then
            echo "::error::Missing secret(s):$missing — add them under Settings -> Secrets and variables -> Actions."
            exit 1
          fi

      - name: Dump production (fresh, same as the nightly backup)
        env:
          SUPABASE_DB_URL: ${{ secrets.PROD_SUPABASE_DB_URL }}
        run: |
          set -euo pipefail
          pg_dump "$SUPABASE_DB_URL" --format=custom --no-owner --no-acl --schema=public --data-only --file=rehearsal.dump

      - name: Verify the fresh dump is valid
        run: |
          set -euo pipefail
          pg_restore --list rehearsal.dump > /dev/null
          echo "Fresh dump verified as valid."
          ls -lh rehearsal.dump

      - name: Capture and drop foreign key constraints
        env:
          TEST_SUPABASE_DB_URL: ${{ secrets.TEST_SUPABASE_DB_URL }}
        run: |
          set -euo pipefail
          # pg_restore's --disable-triggers needs superuser to disable
          # Postgres's own internal FK-check triggers — confirmed live,
          # Supabase's connection role deliberately isn't superuser
          # ("permission denied: RI_ConstraintTrigger_... is a system
          # trigger"). Without it, tables can load in an order where a
          # child row's foreign key points at a parent row that hasn't
          # loaded yet ("Key (organisation_id)=(...) is not present").
          # Fix: drop every public-schema foreign key first (normal
          # owner-level DDL, no special privilege needed), restore data
          # in any order, then recreate every constraint afterward — at
          # which point all the data is already present, so it validates
          # cleanly. Definitions are saved to restore_fks.sql before
          # dropping so the next step can recreate them exactly.
          psql "$TEST_SUPABASE_DB_URL" -v ON_ERROR_STOP=1 -t -A -c "
            SELECT format('ALTER TABLE %s ADD CONSTRAINT %I %s;', conrelid::regclass, conname, pg_get_constraintdef(oid))
            FROM pg_constraint
            WHERE contype = 'f' AND connamespace = 'public'::regnamespace;
          " > restore_fks.sql
          echo "Captured $(wc -l < restore_fks.sql) foreign key definition(s) to reapply after data load."

          psql "$TEST_SUPABASE_DB_URL" -v ON_ERROR_STOP=1 -c "
          DO \$\$
          DECLARE r RECORD;
          BEGIN
            FOR r IN (SELECT conrelid::regclass AS tbl, conname FROM pg_constraint WHERE contype = 'f' AND connamespace = 'public'::regnamespace) LOOP
              EXECUTE format('ALTER TABLE %s DROP CONSTRAINT %I', r.tbl, r.conname);
            END LOOP;
          END \$\$;
          "

      - name: Empty the test project's public tables
        env:
          TEST_SUPABASE_DB_URL: ${{ secrets.TEST_SUPABASE_DB_URL }}
        run: |
          set -euo pipefail
          # A data-only restore doesn't remove existing rows on its own —
          # empty every public table first so this is a clean replace,
          # not an append that would collide on primary keys. No CASCADE
          # needed now that foreign keys are temporarily gone.
          psql "$TEST_SUPABASE_DB_URL" -v ON_ERROR_STOP=1 -c "
          DO \$\$
          DECLARE r RECORD;
          BEGIN
            FOR r IN (SELECT tablename FROM pg_tables WHERE schemaname = 'public') LOOP
              EXECUTE 'TRUNCATE TABLE public.' || quote_ident(r.tablename);
            END LOOP;
          END \$\$;
          "

      - name: Restore data into the TEST project
        env:
          TEST_SUPABASE_DB_URL: ${{ secrets.TEST_SUPABASE_DB_URL }}
        run: |
          set -euo pipefail
          pg_restore --data-only --no-owner --no-acl --dbname="$TEST_SUPABASE_DB_URL" rehearsal.dump

      - name: Recreate foreign key constraints
        env:
          TEST_SUPABASE_DB_URL: ${{ secrets.TEST_SUPABASE_DB_URL }}
        run: |
          set -euo pipefail
          # Validates every row against its constraint as it's added —
          # if this fails, the restored data itself has a genuine
          # inconsistency, not just a load-order artifact.
          psql "$TEST_SUPABASE_DB_URL" -v ON_ERROR_STOP=1 -f restore_fks.sql
          echo "Foreign keys recreated and validated against the restored data."

      - name: Confirm real data landed
        env:
          TEST_SUPABASE_DB_URL: ${{ secrets.TEST_SUPABASE_DB_URL }}
        run: |
          set -euo pipefail
          echo "Row counts in the restored test database:"
          psql "$TEST_SUPABASE_DB_URL" -c "select 'talent_profiles' as table_name, count(*) from talent_profiles union all select 'organisations', count(*) from organisations union all select 'opportunities', count(*) from opportunities;"

      - name: Upload the rehearsal dump for reference
        uses: actions/upload-artifact@v4
        with:
          name: restore-rehearsal-dump
          path: rehearsal.dump
          retention-days: 7
