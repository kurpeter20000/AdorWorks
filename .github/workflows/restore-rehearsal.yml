name: Restore rehearsal (test project only)

# S03-10 — proves the S03-09 backup can actually be restored, not just
# that it exists. Takes a FRESH dump of production (same command the
# backup workflow uses) and restores it straight into the TEST project,
# all in one run — closer to a real disaster-recovery drill than
# reusing an old artifact, and needs no run-id lookups from whoever
# triggers it.
#
# Data-only, same as the backup workflow (see its comment for why):
# AdorWorks's schema is already fully reproducible from
# backend/supabase/migrations/, applied identically to both projects —
# a real restore only ever needs to bring the DATA back, never recreate
# schema/triggers/extensions. Two earlier attempts at a full
# schema+data restore both failed for real, live reasons: dumping
# Supabase's own platform-managed schemas (auth, storage, extensions,
# etc.) collides with the different copies already in the test project
# (575 errors), and even scoped to public alone, pg_dump still captures
# database-wide event triggers Supabase owns as a superuser that a
# non-superuser restoring role can never recreate in any project (687
# errors, "extensions.pgrst_drop_watch"). A data-only dump contains
# none of that.
#
# IMPORTANT: running this OVERWRITES the test project's public-schema
# data (its own application tables — talent profiles, organisations,
# contracts, etc.) with a copy of production's real data for those same
# tables (every public table is truncated first, see below). That's
# intentional — it's what actually proves a restore works — but
# re-seed the test project afterward (cd backend/api &&
# SUPABASE_URL=... SUPABASE_SERVICE_ROLE_KEY=...
# SEED_CONFIRM=yes-seed-this-database npm run seed) so it doesn't sit
# holding a copy of production's application data indefinitely.
#
# Needs a second repository secret beyond the backup workflow's:
# TEST_SUPABASE_DB_URL — the TEST project's Session pooler connection
# string (Supabase dashboard -> the TEST project, not production ->
# Connect -> Session pooler). Same reasoning as PROD_SUPABASE_DB_URL:
# add it directly via GitHub's Settings -> Secrets and variables ->
# Actions UI, never through chat.

on:
  workflow_dispatch: {}

jobs:
  restore-rehearsal:
    runs-on: ubuntu-latest
    container:
      image: postgres:17
    steps:
      - name: Check both secrets are configured
        env:
          PROD_SUPABASE_DB_URL: ${{ secrets.PROD_SUPABASE_DB_URL }}
          TEST_SUPABASE_DB_URL: ${{ secrets.TEST_SUPABASE_DB_URL }}
        run: |
          missing=""
          [ -z "$PROD_SUPABASE_DB_URL" ] && missing="$missing PROD_SUPABASE_DB_URL"
          [ -z "$TEST_SUPABASE_DB_URL" ] && missing="$missing TEST_SUPABASE_DB_URL"
          if [ -n "$missing" ]; then
            echo "::error::Missing secret(s):$missing — add them under Settings -> Secrets and variables -> Actions."
            exit 1
          fi

      - name: Dump production (fresh, same as the nightly backup)
        env:
          SUPABASE_DB_URL: ${{ secrets.PROD_SUPABASE_DB_URL }}
        run: |
          set -euo pipefail
          pg_dump "$SUPABASE_DB_URL" --format=custom --no-owner --no-acl --schema=public --data-only --file=rehearsal.dump

      - name: Verify the fresh dump is valid
        run: |
          set -euo pipefail
          pg_restore --list rehearsal.dump > /dev/null
          echo "Fresh dump verified as valid."
          ls -lh rehearsal.dump

      - name: Empty the test project's public tables first
        env:
          TEST_SUPABASE_DB_URL: ${{ secrets.TEST_SUPABASE_DB_URL }}
        run: |
          set -euo pipefail
          # A data-only restore doesn't remove existing rows on its own —
          # truncate every public table first so this is a clean
          # replace, not an append that would collide on primary keys.
          # CASCADE handles the foreign-key dependency order automatically.
          psql "$TEST_SUPABASE_DB_URL" -v ON_ERROR_STOP=1 -c "
          DO \$\$
          DECLARE r RECORD;
          BEGIN
            FOR r IN (SELECT tablename FROM pg_tables WHERE schemaname = 'public') LOOP
              EXECUTE 'TRUNCATE TABLE public.' || quote_ident(r.tablename) || ' CASCADE';
            END LOOP;
          END \$\$;
          "

      - name: Restore data into the TEST project
        env:
          TEST_SUPABASE_DB_URL: ${{ secrets.TEST_SUPABASE_DB_URL }}
        run: |
          set -euo pipefail
          # --disable-triggers: standard practice for a data-only restore
          # of tables with foreign keys between them — avoids constraint
          # checks firing mid-load before every table's data has arrived.
          # Safe here since the restoring role owns these tables (it's
          # the same role the migrations created them with).
          pg_restore --data-only --disable-triggers --no-owner --no-acl --dbname="$TEST_SUPABASE_DB_URL" rehearsal.dump

      - name: Confirm real data landed
        env:
          TEST_SUPABASE_DB_URL: ${{ secrets.TEST_SUPABASE_DB_URL }}
        run: |
          set -euo pipefail
          echo "Row counts in the restored test database:"
          psql "$TEST_SUPABASE_DB_URL" -c "select 'talent_profiles' as table_name, count(*) from talent_profiles union all select 'organisations', count(*) from organisations union all select 'opportunities', count(*) from opportunities;"

      - name: Upload the rehearsal dump for reference
        uses: actions/upload-artifact@v4
        with:
          name: restore-rehearsal-dump
          path: rehearsal.dump
          retention-days: 7
