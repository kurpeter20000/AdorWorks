<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Opportunities — AdorWorks Staff</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="../img/adorworks-mark.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/themes.css">
<link rel="stylesheet" href="../css/styles.css">
<link rel="stylesheet" href="css/staff.css">
</head>
<body>

<header class="staff-header">
  <div class="container">
    <a class="brand" href="index.html">
      <img src="../img/adorworks-mark-reversed.svg" alt="AdorWorks" width="30" height="30">
      <span>AdorWorks Staff</span>
    </a>
    <div class="staff-header-right">
      <span id="staff-who" class="staff-who"></span>
      <button id="logout-btn" class="staff-logout" type="button">Sign out</button>
    </div>
  </div>
</header>
<nav class="staff-nav" aria-label="Staff sections">
  <div class="container">
    <a href="index.html">Dashboard</a>
    <a href="intake.html">Intake</a>
    <a href="talent.html">Talent</a>
    <a href="organisations.html">Organisations</a>
    <a href="opportunities.html" aria-current="page">Opportunities</a>
    <a href="services.html">Services</a>
    <a href="engagements.html">Engagements</a>
    <a href="contracts.html">Contracts</a>
    <a href="assisted-onboarding.html">Assisted onboarding</a>
    <a href="people.html">People</a>
  </div>
</nav>

<main id="main" class="staff-main">
  <div class="container">
    <div class="staff-page-header">
      <h1>Opportunities</h1>
      <button type="button" id="create-toggle" class="btn btn-secondary">+ New opportunity</button>
    </div>

    <div id="create-panel" class="card mb-1" hidden>
      <h3>New opportunity</h3>
      <form id="create-form">
        <div class="form-grid">
          <div class="form-grid form-grid-2">
            <div>
              <label for="create-org">Organisation</label>
              <select id="create-org" required><option value="">Loading…</option></select>
            </div>
            <div>
              <label for="create-type">Type</label>
              <select id="create-type" required>
                <option value="service">Service</option>
                <option value="project">Project</option>
                <option value="contract">Contract</option>
                <option value="full_time">Full-time</option>
                <option value="squad">Squad</option>
              </select>
            </div>
          </div>
          <div>
            <label for="create-title">Title</label>
            <input type="text" id="create-title" required>
          </div>
          <div>
            <label for="create-brief">Brief</label>
            <textarea id="create-brief"></textarea>
          </div>
          <div class="form-grid form-grid-2">
            <div>
              <label for="create-category">Category</label>
              <select id="create-category" required>
                <option value="">—</option>
                <option value="creative_media">Creative &amp; media</option>
                <option value="digital_technology">Digital &amp; technology</option>
                <option value="business_project_support">Business &amp; project support</option>
              </select>
            </div>
            <div>
              <label for="create-skills">Skills (comma-separated, at least one)</label>
              <input type="text" id="create-skills" required>
            </div>
          </div>
          <div class="form-grid form-grid-2">
            <div>
              <label for="create-engagement-type">Engagement type</label>
              <select id="create-engagement-type" required>
                <option value="freelance">Freelance</option>
                <option value="fixed_term_contract">Fixed-term contract</option>
                <option value="full_time">Full-time</option>
                <option value="internship">Internship</option>
                <option value="apprenticeship">Apprenticeship</option>
                <option value="managed_service">Managed service</option>
              </select>
            </div>
            <div>
              <label for="create-payment-basis">Paid</label>
              <select id="create-payment-basis" required>
                <option value="fixed">Fixed price</option>
                <option value="milestone">Per milestone</option>
                <option value="hourly">Hourly</option>
                <option value="daily">Daily</option>
                <option value="monthly">Monthly</option>
                <option value="negotiable">Negotiable</option>
              </select>
            </div>
          </div>
          <div class="form-grid form-grid-2">
            <div>
              <label for="create-location">Location / work mode</label>
              <input type="text" id="create-location">
            </div>
            <div>
              <label for="create-currency">Currency</label>
              <input type="text" id="create-currency" value="SSP">
            </div>
          </div>
          <div class="form-grid form-grid-2">
            <div>
              <label for="create-budget-min">Budget min (or max — at least one is required)</label>
              <input type="number" id="create-budget-min" min="0">
            </div>
            <div>
              <label for="create-budget-max">Budget max</label>
              <input type="number" id="create-budget-max" min="0">
            </div>
          </div>
        </div>
        <button type="submit" class="btn btn-primary" style="margin-top:1rem;">Create opportunity</button>
        <div id="create-status" class="form-status" role="status"></div>
      </form>
    </div>

    <div class="filter-bar">
      <span class="filter-chip" data-status-filter="pending_review" aria-pressed="true">Pending review</span>
      <span class="filter-chip" data-status-filter="changes_required" aria-pressed="false">Changes requested</span>
      <span class="filter-chip" data-status-filter="open" aria-pressed="false">Open</span>
      <span class="filter-chip" data-status-filter="paused" aria-pressed="false">Paused</span>
      <span class="filter-chip" data-status-filter="filled" aria-pressed="false">Filled</span>
      <span class="filter-chip" data-status-filter="closed" aria-pressed="false">Closed</span>
      <span class="filter-chip" data-status-filter="expired" aria-pressed="false">Expired</span>
      <span class="filter-chip" data-status-filter="rejected" aria-pressed="false">Rejected</span>
      <span class="filter-chip" data-status-filter="" aria-pressed="false">All</span>
    </div>

    <div class="staff-table-wrap">
      <table class="staff-table">
        <thead>
          <tr><th>Title</th><th>Organisation</th><th>Type</th><th>Shortlisting</th><th>Status</th><th>Created</th></tr>
        </thead>
        <tbody id="opps-body">
          <tr><td colspan="6" class="staff-empty">Loading…</td></tr>
        </tbody>
      </table>
    </div>
  </div>
</main>

<script type="module" src="js/config.js"></script>
<script type="module" src="js/opportunities.js"></script>
</body>
</html>
