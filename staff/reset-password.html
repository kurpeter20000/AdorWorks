<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Set new password — AdorWorks Staff</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="../img/adorworks-mark.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/themes.css">
<link rel="stylesheet" href="../css/styles.css">
<link rel="stylesheet" href="css/staff.css">
</head>
<body>
<div class="login-shell">
  <div class="login-card">
    <a class="brand" href="../index.html">
      <img src="../img/adorworks-mark.svg" alt="AdorWorks" width="34" height="34">
      <span>AdorWorks Staff</span>
    </a>
    <form id="reset-form" style="display:none;">
      <div class="form-grid">
        <div>
          <label for="reset-password">New password</label>
          <input type="password" id="reset-password" name="password" autocomplete="new-password" minlength="8" required>
        </div>
      </div>
      <button type="submit" class="btn btn-primary btn-block" style="margin-top:1.25rem;">Set new password</button>
    </form>
    <div id="reset-status" class="form-status" role="status"></div>
  </div>
</div>

<script type="module" src="js/config.js"></script>
<script type="module" src="js/reset-password.js"></script>
</body>
</html>
