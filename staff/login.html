<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Staff sign in — AdorWorks</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="../img/adorworks-mark.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/themes.css">
<link rel="stylesheet" href="../css/styles.css">
<link rel="stylesheet" href="css/staff.css">
</head>
<body>
<div class="login-shell">
  <div class="login-card">
    <a class="brand" href="../index.html">
      <img src="../img/adorworks-mark.svg" alt="AdorWorks" width="34" height="34">
      <span>AdorWorks Staff</span>
    </a>
    <form id="login-form">
      <div class="form-grid">
        <div>
          <label for="login-email">Email</label>
          <input type="email" id="login-email" name="email" autocomplete="username" required>
        </div>
        <div>
          <label for="login-password">Password</label>
          <input type="password" id="login-password" name="password" autocomplete="current-password" required>
        </div>
      </div>
      <button type="submit" class="btn btn-primary btn-block" style="margin-top:1.25rem;">Sign in</button>
      <div id="login-status" class="form-status" role="status"></div>
    </form>
    <p class="text-sm muted mt-1 mb-0">
      No account yet? Staff accounts are created in the Supabase dashboard
      (Authentication → Users), then promoted to a staff role by an
      admin — see <code>backend/supabase/README.md</code>.
    </p>
  </div>
</div>

<script type="module" src="js/config.js"></script>
<script type="module" src="js/login.js"></script>
</body>
</html>
