<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reset password — AdorWorks Staff</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="../img/adorworks-mark.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/themes.css">
<link rel="stylesheet" href="../css/styles.css">
<link rel="stylesheet" href="css/staff.css">
</head>
<body>
<div class="login-shell">
  <div class="login-card">
    <a class="brand" href="../index.html">
      <img src="../img/adorworks-mark.svg" alt="AdorWorks" width="34" height="34">
      <span>AdorWorks Staff</span>
    </a>
    <form id="forgot-form">
      <div class="form-grid">
        <div>
          <label for="forgot-email">Email</label>
          <input type="email" id="forgot-email" name="email" autocomplete="username" required>
        </div>
      </div>
      <button type="submit" class="btn btn-primary btn-block" style="margin-top:1.25rem;">Send reset link</button>
      <div id="forgot-status" class="form-status" role="status"></div>
    </form>
    <p class="text-sm mt-1 mb-0"><a href="login.html">Back to sign in</a></p>
  </div>
</div>

<script type="module" src="js/config.js"></script>
<script type="module" src="js/forgot-password.js"></script>
</body>
</html>
